<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-hidden="true">
  <!-- Eigen SVG-illustratie: het atelier van Studio Wester met een werktafel,
       materiaalstalen en een schetsblok — poster voor de atelierrondleiding. -->
  <defs>
    <linearGradient id="vf-bg2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#efe9da" />
      <stop offset="100%" stop-color="#f6f4ee" />
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#vf-bg2)" />
  <rect x="0" y="520" width="1280" height="200" fill="#e3ded0" />

  <!-- werktafel -->
  <rect x="140" y="460" width="1000" height="26" rx="6" fill="#18181b" />
  <rect x="180" y="486" width="20" height="140" fill="#18181b" />
  <rect x="1080" y="486" width="20" height="140" fill="#18181b" />

  <!-- materiaalstalen: rij vierkantjes in Seveke/Wester-tinten -->
  <g>
    <rect x="220" y="380" width="70" height="70" rx="8" fill="#2f6fed" />
    <rect x="304" y="380" width="70" height="70" rx="8" fill="#4c7a3f" />
    <rect x="388" y="380" width="70" height="70" rx="8" fill="#c47b3b" />
    <rect x="472" y="380" width="70" height="70" rx="8" fill="#18181b" />
    <rect x="556" y="380" width="70" height="70" rx="8" fill="#e3ded0" stroke="#18181b" stroke-width="2" />
  </g>

  <!-- schetsblok -->
  <g transform="translate(720 350) rotate(-4)">
    <rect x="0" y="0" width="220" height="150" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="3" />
    <line x1="20" y1="35" x2="160" y2="35" stroke="#6b6a62" stroke-width="4" stroke-linecap="round" />
    <line x1="20" y1="60" x2="190" y2="60" stroke="#6b6a62" stroke-width="4" stroke-linecap="round" />
    <line x1="20" y1="85" x2="130" y2="85" stroke="#2f6fed" stroke-width="4" stroke-linecap="round" />
    <line x1="20" y1="110" x2="170" y2="110" stroke="#6b6a62" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- hanglamp -->
  <line x1="1000" y1="0" x2="1000" y2="150" stroke="#18181b" stroke-width="3" />
  <path d="M950 150 a50 30 0 0 0 100 0 z" fill="#18181b" />

  <rect x="0" y="0" width="1280" height="6" fill="#4c7a3f" />
</svg>

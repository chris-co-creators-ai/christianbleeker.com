<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-hidden="true">
  <!-- Eigen, met de hand getekende SVG-illustratie (geen stockfoto, geen AI-beeld):
       een rustige woonkamerhoek in de Studio Wester-kleuren, als poster voor het
       klantverhaal-interview. -->
  <defs>
    <linearGradient id="vf-bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f4ee" />
      <stop offset="100%" stop-color="#e9e4d4" />
    </linearGradient>
    <linearGradient id="vf-window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dce8f2" />
      <stop offset="100%" stop-color="#c3d8ea" />
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#vf-bg1)" />

  <!-- vloerlijn -->
  <rect x="0" y="560" width="1280" height="160" fill="#e3ded0" />

  <!-- raam -->
  <rect x="860" y="90" width="300" height="420" rx="6" fill="url(#vf-window)" stroke="#18181b" stroke-width="3" />
  <line x1="1010" y1="90" x2="1010" y2="510" stroke="#18181b" stroke-width="3" />
  <line x1="860" y1="300" x2="1160" y2="300" stroke="#18181b" stroke-width="3" />

  <!-- fauteuil (silhouet) -->
  <g>
    <rect x="220" y="400" width="360" height="180" rx="26" fill="#18181b" />
    <rect x="220" y="330" width="110" height="200" rx="24" fill="#18181b" />
    <rect x="470" y="330" width="110" height="200" rx="24" fill="#18181b" />
    <rect x="200" y="560" width="20" height="70" rx="6" fill="#18181b" />
    <rect x="580" y="560" width="20" height="70" rx="6" fill="#18181b" />
  </g>

  <!-- sierkussen -->
  <rect x="300" y="410" width="110" height="100" rx="18" fill="#2f6fed" opacity="0.85" transform="rotate(-6 355 460)" />

  <!-- plant -->
  <g stroke="#6b6a62" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M700 560 C700 480 660 440 630 400" />
    <path d="M700 560 C700 470 730 430 760 390" />
    <path d="M700 560 C700 500 700 460 700 420" />
  </g>
  <rect x="665" y="555" width="70" height="60" rx="8" fill="#4c7a3f" />

  <!-- bijzettafel + kop koffie -->
  <rect x="760" y="500" width="120" height="14" rx="4" fill="#18181b" />
  <rect x="770" y="514" width="14" height="66" fill="#18181b" />
  <rect x="856" y="514" width="14" height="66" fill="#18181b" />
  <circle cx="815" cy="485" r="16" fill="#f6f4ee" stroke="#18181b" stroke-width="3" />

  <!-- ondertitel-strip (puur decoratief, geen echte tekst nodig: alt is leeg) -->
  <rect x="0" y="0" width="1280" height="6" fill="#2f6fed" />
</svg>
